name: Bug report
description: Something is broken
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open file foo.pdf
        2. Click Merge
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KillerPDF version
      placeholder: v2.0.0-fork.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: text
